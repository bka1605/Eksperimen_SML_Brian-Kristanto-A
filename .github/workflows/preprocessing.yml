name: Data Preprocessing Automation

on:
  push:
    branches:
      - main
    paths:
      - 'mobile_price_cls_raw/**'
      - 'automate_Brian.py'
      - '.github/workflows/preprocessing.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12.7'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas scikit-learn

    - name: Run Preprocessing Script
      run: |
        python automate_Brian.py

    - name: Commit and Push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add mobile_price_cls_preprocessing/
        git commit -m "Auto-preprocess dataset mobile_price_classification" || echo "Tidak ada perubahan untuk di-commit"
        git push